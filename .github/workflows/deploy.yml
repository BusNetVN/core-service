name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull main and deploy core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git -C F:\core-service checkout main
          if (git -C F:\core-service remote get-url origin 2>$null) {
            git -C F:\core-service fetch origin
            git -C F:\core-service pull --ff-only origin main
          }
          Set-Location F:\
          docker compose up --build -d core
